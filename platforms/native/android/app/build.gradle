apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

// Package only the canonical public pins, never the content tree or account data.
def sourceReaderAssets = layout.buildDirectory.dir('generated/sourceReaderAssets')
def packageSourceReaderCatalog = tasks.register('packageSourceReaderCatalog', Copy) {
    from(new File(projectRoot, '../../lib/books/source-reader-catalog.json'))
    into(sourceReaderAssets)
}
tasks.configureEach { task -> if (task.name == 'preBuild') task.dependsOn(packageSourceReaderCatalog) }

def clipResources = layout.buildDirectory.dir('generated/soeClipResources')
def clipPackager = new File(projectRoot, 'prepare-clip-assets.cjs')
def packageClipAssets = tasks.register('packageSoeClipAssets', Exec) {
    inputs.files(clipPackager, new File(projectRoot, 'clip-catalog.json'), new File(projectRoot, '../../lib/clips/registry.json'))
    inputs.files(fileTree(new File(projectRoot, '../../content/clips')) {
        include 'circle-intro.*', 'night-sky-traffic.*', 'telescope-first-tilt.*', 'which-height.*',
                'circle-intro-inspection.json', 'night-sky-traffic-inspection.json', 'telescope-first-tilt-inspection.json',
                'which-height-inspection.json'
    })
    outputs.dir(clipResources)
    doFirst { commandLine('node', clipPackager.absolutePath, clipResources.get().dir('raw').asFile.absolutePath) }
}
tasks.configureEach { task -> if (task.name == 'preBuild') task.dependsOn(packageClipAssets) }

// Public application policy only. No environment/launch-extra/credential lookup.
// Empty policy keeps NativeSoeMember unavailable; partial/invalid policy aborts.
def soeMemberPolicyProcess = new ProcessBuilder('node', rootProject.file('member-config.cjs').absolutePath,
    providers.gradleProperty('soeMemberOrigin').orElse('').get(),
    providers.gradleProperty('soeMemberStorageKey').orElse('').get(),
    providers.gradleProperty('soeProviderOrigin').orElse('').get(),
    providers.gradleProperty('soePublishableKey').orElse('').get(),
    providers.gradleProperty('soeEnableReelLinks').orElse('false').get()).directory(rootDir).start()
def soeMemberPolicyJson = soeMemberPolicyProcess.inputStream.getText('UTF-8')
soeMemberPolicyProcess.errorStream.getText('UTF-8')
if (soeMemberPolicyProcess.waitFor() != 0) throw new GradleException('SoE member public configuration rejected.')
def soeMemberPolicy = new groovy.json.JsonSlurper().parseText(soeMemberPolicyJson)

// Debug/synthetic are local fixtures. Release requires an explicitly supplied,
// private owner-reviewed descriptor outside this checkout; no environment lookup.
def soeReleaseConfigPath = providers.gradleProperty('soeReleaseConfig').orNull
def soeReleasePolicy = rootProject.file('release-policy.cjs')
def validateSoeRelease = { String expectedHash ->
    if (!soeReleaseConfigPath) {
        throw new GradleException('SoE release blocked: explicit soeReleaseConfig required; debug and synthetic remain local fixtures.')
    }
    def command = ['node', soeReleasePolicy.absolutePath, soeReleaseConfigPath]
    if (expectedHash) command.add(expectedHash)
    def process = new ProcessBuilder(command).directory(rootDir).start()
    def safeOutput = process.inputStream.getText('UTF-8')
    process.errorStream.getText('UTF-8') // consume sanitized policy errors without logging
    if (process.waitFor() != 0) {
        throw new GradleException('SoE release blocked: owned identity/signing descriptor rejected; no credential values are logged.')
    }
    return new groovy.json.JsonSlurper().parseText(safeOutput)
}
def soeReleaseMetadata = soeReleaseConfigPath ? validateSoeRelease(null) : null
def soeReleaseCredentials = null
if (soeReleaseMetadata) {
    def bytes = new File(soeReleaseConfigPath).bytes
    def hash = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
    if (hash != soeReleaseMetadata.configSha256) throw new GradleException('SoE release blocked: descriptor changed.')
    soeReleaseCredentials = new groovy.json.JsonSlurper().parseText(new String(bytes, 'UTF-8'))
}

def verifySoeReleaseConfiguration = tasks.register('verifySoeReleaseConfiguration') {
    group = 'verification'
    description = 'Reject release work without explicitly owned identity and non-debug signing.'
    notCompatibleWithConfigurationCache('Private release descriptor must be revalidated for every invocation.')
    doLast { validateSoeRelease(soeReleaseMetadata?.configSha256) }
}
// Attach to every release task, including internal packaging/signing/compile
// tasks reached through aggregate assemble, bundle, build or install requests.
tasks.configureEach { task ->
    if (task.name != 'verifySoeReleaseConfiguration' && task.name.toLowerCase(java.util.Locale.ROOT).contains('release')) {
        task.dependsOn(verifySoeReleaseConfiguration)
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    sourceSets.main.assets.srcDir(sourceReaderAssets)
    sourceSets.main.res.srcDir(clipResources)
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.anonymous.soesyntheticdemo'
    defaultConfig {
        applicationId soeReleaseMetadata?.applicationId ?: 'com.anonymous.soesyntheticdemo'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "SOE_EMBEDDED_SYNTHETIC", "false"
        buildConfigField "boolean", "SOE_REEL_LINKS_ENABLED", "false"
        buildConfigField "String", "SOE_MEMBER_ORIGIN", '"' + soeMemberPolicy.origin + '"'
        buildConfigField "String", "SOE_PROVIDER_ORIGIN", '"' + (soeMemberPolicy.providerOrigin ?: '') + '"'
        buildConfigField "String", "SOE_PUBLISHABLE_KEY", '"' + (soeMemberPolicy.publishableKey ?: '') + '"'
        buildConfigField "String", "SOE_MEMBER_STORAGE_KEY", '"' + soeMemberPolicy.storageKey + '"'

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        soeOwnedRelease {
            if (soeReleaseCredentials) {
                storeFile new File(soeReleaseMetadata.storeFile)
                storePassword soeReleaseCredentials.storePassword
                keyAlias soeReleaseMetadata.keyAlias
                keyPassword soeReleaseCredentials.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Supplying an owned release descriptor must not install a debug
            // fixture over the separately identified release application.
            applicationIdSuffix soeReleaseMetadata ? '.debug' : ''
        }
        synthetic {
            initWith debug
            applicationIdSuffix ".embedded"
            versionNameSuffix "-synthetic-embedded"
            matchingFallbacks = ["debug"]
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "boolean", "SOE_EMBEDDED_SYNTHETIC", "true"
        }
        release {
            signingConfig signingConfigs.soeOwnedRelease
            debuggable false
            def reelHost = soeMemberPolicy.reelLinkHost
            buildConfigField "boolean", "SOE_REEL_LINKS_ENABLED", reelHost ? "true" : "false"
            manifestPlaceholders += [soeReelLinkHost: reelHost ?: 'disabled.invalid', soeReelLinkVerify: reelHost ? 'true' : 'false']
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    testBuildType = findProperty("soeTestBuildType") ?: "debug"
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Only the separately identified synthetic APK embeds development-mode JS.
// Release bundling keeps the React Native plugin's devEnabled=false default.
gradle.projectsEvaluated {
    tasks.named("createBundleSyntheticJsAndAssets", com.facebook.react.tasks.BundleHermesCTask).configure {
        devEnabled.set(true)
        doFirst { logger.lifecycle("SOE_SYNTHETIC_BUNDLE_DEV=" + devEnabled.get()) }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
